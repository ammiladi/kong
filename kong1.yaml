_format_version: "3.0"

# Vault, à la place du static :
# vaults:
#   - name: env            # mock : variable d'environnement du data plane
#     prefix: hcv
#   # - name: hashicorp    # Vault réel
#   #   prefix: hcv
#   #   config:
#   #     host: <hôte Vault>
#   #     port: 8200
#   #     protocol: https
#   #     kv: v2
#   #     mount: secret
#   #     auth_method: approle
#   #     approle_role_id: <role id>
#   #     approle_secret_id: <secret id>
#   #     ttl: 60

services:
  - name: orders-service
    url: http://orders:8080
    routes:
      - name: orders-route
        hosts: [api.example]
        paths: [/orders]
        methods: [GET, POST, PUT, PATCH, DELETE]
        protocols: [https]
        strip_path: false
        plugins:
          - name: jwt-signer
            config:
              channel_token_optional: true
              access_token_signing: true
              access_token_signing_algorithm: RS256
              access_token_upstream_header: "Authorization:Bearer"
              access_token_jwks_uri: https://api.example/.well-known/jwks.json
              access_token_jwks_uri_rotate_period: 60
              access_token_issuers_allowed:
                - api.example
              access_token_issuer: api.example
              access_token_keyset: http://127.0.0.1:8000/internal/signing-jwks
              access_token_keyset_rotate_period: 60

  - name: public-jwks
    url: http://127.0.0.1:9
    routes:
      - name: public-jwks-route
        hosts: [api.example]
        paths: [/.well-known/jwks.json]
        methods: [GET]
        protocols: [https]
        strip_path: true
        plugins:
          - name: datakit
            config:
              # resources:
              #   vault:
              #     public_jwks: "{vault://hcv/PUBLIC_JWKS}"
              nodes:
                - name: JWKS
                  type: static
                  values:
                    keys:
                      - kty: RSA
                        kid: internal-signing-1
                        alg: RS256
                        use: sig
                        n: "skc3kMuKgTcD_dlVmTWdFyCj7PF03wvDtQJuE0NhFuko1SJ7Dv9_GOJSQd0wE2v347bdRv6qyzB71RPhLb8CIwupCcrWnFkiiDuUo5KLx1M2ceTmT8LTFZzPCfnN1wETwKogsQQOgNIcpfwoAeuMiZryQeTVrERbGCTmXnSFxk5quyKVi68dPyOauUeMJ0g6CRIG6xNVDgOdmlJsjni0wzKA59SQ-92aSIMTJ2IqkEET_Km8Q_dnSIjLhXIkQyFGkMzKhgpfPVWMhsNU1TsD0cCnUUWix5R9oDqjchskcMkYVuol8wxSeMbnSREUs1DSCMVcOE8A7rfefazTY1WV1Q"
                        e: "AQAB"
                # Pour Vault, remplace le nœud JWKS par rien et change l'entrée :
                #   body: vault.public_jwks
                - name: RESPOND
                  type: exit
                  status: 200
                  inputs:
                    body: JWKS

  - name: private-jwks
    url: http://127.0.0.1:9
